# fly.toml app configuration file generated for floodai-8eclra on 2026-07-06T17:01:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'floodai-8eclra'
primary_region = 'sin'

# 512 MB of RAM is almost used up by the models (305 MB), the daily model's rain data (+130 MB) and the
# Riwayat tables (+17 MB); the 15-minute refresh then spikes past it and the process was OOM-killed or hung
# (24 Nov 13:28 UTC, 25 Nov 01:19 UTC). Swap turns that spike into a short slowdown instead.
swap_size_mb = 512

[build]

[env]
  # No direct Postgres connection on Fly (no DB_* secrets), so the feature-history
  # write failed every run. History now lives in realtime_snapshot_store
  # ('history:' rows, written over HTTPS); the lag features still start empty.
  FEATURE_HISTORY_DB_ENABLED = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  # 'off': Fly never stops a running machine. With 'stop' it stopped or
  # suspended both machines despite min_machines_running, which halted the
  # 15-minute snapshot scheduler until the next visitor woke the app.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
