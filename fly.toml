# fly.toml app configuration file generated for floodai-8eclra on 2026-07-06T17:01:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'floodai-8eclra'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
